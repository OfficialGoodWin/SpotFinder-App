name: Rebuild ambient POI tiles

# Ambient POIs (cafes, museums, viewpoints...) don't change hourly — monthly
# is plenty. See scripts/ambient-tiles/README.md for background. Before this
# does anything useful you need to set two things:
#   1. Repo secret BLOB_READ_WRITE_TOKEN (Vercel dashboard → Storage → your
#      Blob store → ".env.local" tab).
#   2. Repo variable AMBIENT_TILES_BBOX (south,west,north,east) — or just
#      edit the fallback value below.
on:
  schedule:
    - cron: '0 3 1 * *' # 03:00 UTC on the 1st of each month
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git
          cd tippecanoe && make -j"$(nproc)" && sudo make install

      - name: Install build deps
        working-directory: scripts/ambient-tiles
        run: npm install

      - name: Build and upload tiles
        working-directory: scripts/ambient-tiles
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        # TODO: set your coverage area (south,west,north,east) as a repo
        # variable AMBIENT_TILES_BBOX, or edit the fallback below directly.
        run: ./build.sh "${{ vars.AMBIENT_TILES_BBOX || '48.5,12.0,51.1,18.9' }}"
